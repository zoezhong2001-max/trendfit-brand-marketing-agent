[project]
name = "trendfit"
version = "0.1.0"
description = "Evidence-first brand trend marketing agent prototype"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zoe Zhong"}]

[project.scripts]
trendfit = "trendfit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trendfit"]
