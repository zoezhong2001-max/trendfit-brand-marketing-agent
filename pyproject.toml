[project]
name = "trendfit"
version = "0.2.5"
description = "Evidence-first brand trend marketing agent prototype"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zoe Zhong"}]

[project.scripts]
trendfit = "trendfit.cli:main"
trendfit-cross-brand = "trendfit.cross_brand:main"
trendfit-views = "trendfit.views:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trendfit"]
